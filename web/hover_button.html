<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QingxinHoverBtn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #FFFFFF;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 悬浮翻译按钮：占满窗口（72x28）。普通窗口 + Win11 系统圆角
           （四角真透明露桌面）；系统圆角自带的淡投影跟随系统主题。 */
        .hover-btn {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #FFFFFF;
            border: 1px solid #E8A0A6;
            border-radius: 8px;
            padding: 0 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            animation: btnIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: background 0.15s ease;
        }

        .hover-btn:hover {
            background: #FFF5F6;
        }

        .hover-btn:active {
            background: #FADADE;
        }

        @keyframes btnIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 图标容器：flex 居中，防止 SVG 基线偏移 */
        .hover-btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .hover-btn-icon svg {
            display: block;
            width: 14px;
            height: 14px;
            color: #E8A0A6;
            stroke: #E8A0A6;
            fill: none;
        }

        #hover-btn-text {
            font-size: 12px;
            line-height: 1;
            color: #555555;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="hover-btn" id="hover-btn">
        <span class="hover-btn-icon">
            <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/>
                <path d="M8.5 10h7M8.5 13.5h4.5"/>
            </svg>
        </span>
        <span id="hover-btn-text">翻译</span>
    </div>

    <script>
        let _lastClickTs = 0;
        // 点击按钮：触发划词翻译（mousedown 阻止默认行为防选中，mouseup 触发一次）
        // 注意：按钮窗口复用（hide/show 不重载页面），不能使用永久标志——
        // 用时间戳防抖保证每次显示后的点击都能触发
        document.getElementById('hover-btn').addEventListener('mousedown', function(e) {
            e.preventDefault();
            e.stopPropagation();
        });
        document.addEventListener('mouseup', function() {
            const now = Date.now();
            if (now - _lastClickTs < 300) return;  // 防抖：300ms 内不重复触发
            _lastClickTs = now;
            try {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.hover_btn_clicked();
                }
            } catch (err) {}
        });

        // 兼容接口：窗口尺寸由 Python 端固定（72x28），无需 JS 测量
        function fitHoverBtn() {
            // 无操作（保留供 Python 端调用）
        }

        window.addEventListener('DOMContentLoaded', function() { fitHoverBtn(); });
        if (document.readyState !== 'loading') {
            fitHoverBtn();
        }
    </script>
</body>
</html>
