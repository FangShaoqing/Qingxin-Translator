<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QingxinBubble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #FFFFFF;
            overflow: hidden;
            font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 细边框小卡片气泡：无标题栏、无原文，仅译文 */
        .bubble {
            width: calc(100vw - 8px);
            height: calc(100vh - 8px);
            margin: 4px;  /* 留出阴影空间，避免被窗口裁剪 */
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1px solid #F0C4C8;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12), 0 1px 4px rgba(240, 196, 200, 0.5);
            padding: 6px 10px;
            user-select: text;
            -webkit-user-select: text;
            cursor: default;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        #bubble-translation {
            font-size: 13px;
            color: #333333;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            width: 100%;
        }

        .bubble-error {
            color: #f44336 !important;
        }
    </style>
</head>
<body>
    <div class="bubble">
        <div id="bubble-translation">翻译中...</div>
    </div>

    <script>
        // 由 Python 端 evaluate_js 调用，设置气泡内容
        window.__setBubbleContent = function(sourceText, translation) {
            const el = document.getElementById('bubble-translation');
            el.textContent = translation;
            el.className = '';
            fitBubbleHeight();
        };

        window.__setBubbleError = function(message) {
            const el = document.getElementById('bubble-translation');
            el.textContent = message;
            el.className = 'bubble-error';
            fitBubbleHeight();
        };

        // 根据译文长度自适应气泡尺寸（宽度和高度都跟随内容）
        function fitBubbleHeight() {
            try {
                if (!window.pywebview || !window.pywebview.api) return;
                const translation = document.getElementById('bubble-translation');
                
                // 测量译文文本自然宽度（canvas 估算，与 CSS 字号一致）
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.font = '13px "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif';
                const textWidth = ctx.measureText(translation.textContent).width;
                
                // 气泡宽度 = 文本宽度 + padding(20) + 边框(2) + margin(8)，限制 120~400
                const width = Math.max(120, Math.min(Math.ceil(textWidth) + 30, 400));
                
                // 按目标宽度设置内容宽度，测量实际换行后的高度
                const contentWidth = width - 8 - 2 - 20;  // margin + border + padding
                translation.style.width = contentWidth + 'px';
                const transH = translation.scrollHeight;
                // 高度 = 译文 + padding(12) + 边框(2) + margin(8)
                const height = Math.max(42, Math.min(transH + 22, 268));
                
                window.pywebview.api.resize_bubble(width, Math.round(height));
            } catch (e) {}
        }

        // 右键单击关闭气泡
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            try {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.hide_bubble();
                }
            } catch (err) {}
        });

        // 鼠标悬停时暂停自动隐藏，移开后恢复
        document.addEventListener('mouseenter', function() {
            try {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.bubble_interacting(true);
                }
            } catch (e) {}
        });
        document.addEventListener('mouseleave', function() {
            try {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.bubble_interacting(false);
                }
            } catch (e) {}
        });

        // 页面加载完成后先自适应一次（"翻译中..."初始尺寸）
        window.addEventListener('DOMContentLoaded', function() {
            fitBubbleHeight();
        });
        if (document.readyState !== 'loading') {
            fitBubbleHeight();
        }
    </script>
</body>
</html>
